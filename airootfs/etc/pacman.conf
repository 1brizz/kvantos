#
# /etc/pacman.conf — live-окружение KvantOS
#

[options]
HoldPkg     = pacman glibc
Architecture = auto
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 5

# Репозиторий CachyOS идёт первым: приоритет оптимизированных пакетов.
[cachyos]
Include = /etc/pacman.d/cachyos-mirrorlist

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# Локальный репозиторий KvantOS: IDE из AUR.
# В live-режиме и в установленной системе доступен офлайн
# (копируется в target установщиком, см. shellprocess_kvantos_init_pacman.conf).
[kvantos]
SigLevel = Optional TrustAll
Server = file:///opt/kvantos/customrepo
