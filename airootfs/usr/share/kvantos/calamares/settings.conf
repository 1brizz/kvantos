#
# KvantOS — конфигурация Calamares.
# Структура по образцу cachyos-calamares 3.4.2 (наши модули — через
# экземпляры с суффиксом kvantos, остальное — конфиги из пакета):
# pacstrap ставит базу, packages@kvantos-pkgs — выбранное в netinstall.
---
modules-search: [ local ]

instances:
- id:       kvantos-mode
  module:   packagechooser
  config:   packagechooser_kvantos_mode.conf

- id:       desktop
  module:   packagechooser
  config:   packagechooser_kvantos_desktop.conf

- id:       netinst
  module:   netinstall
  config:   netinstall_kvantos.conf

- id:       initialize_pacman
  module:   shellprocess
  config:   shellprocess_kvantos_init_pacman.conf

- id:       base
  module:   pacstrap
  config:   pacstrap_kvantos.conf

- id:       kvantos-pkgs
  module:   packages
  config:   packages_kvantos.conf

- id:       boot
  module:   bootloader
  config:   bootloader_kvantos.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - packagechooser@kvantos-mode
  - packagechooser@desktop
  - netinstall@netinst
  - users
  - summary
- exec:
  - partition
  - mount
  - shellprocess@initialize_pacman
  - pacstrap@base
  - machineid
  - locale
  - keyboard
  - localecfg
  - packages@kvantos-pkgs
  - luksbootkeyfile
  - luksopenswaphookcfg
  - fstab
  - initcpiocfg
  - initcpio
  - users
  - networkcfg
  - displaymanager
  - hwclock
  - grubcfg
  - bootloader@boot
  - services-systemd
  - umount
- show:
  - finished

branding: kvantos

prompt-install: true

dont-chroot: false

oem-setup: false

disable-cancel: false

disable-cancel-during-exec: false

hide-back-and-next-during-exec: true

quit-at-end: false
