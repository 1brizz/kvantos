# SPDX-FileCopyrightText: no
# SPDX-License-Identifier: CC0-1.0
#
# KvantOS — обязательный выбор режима системы (Dual-Mode AUR/Nix).
# method: netinstall-select — id выбранной карточки включает одноимённую
# группу в netinstall_kvantos.yaml («Декларативный стек (Nix)»).
# Дефолта нет: без явного выбора «Далее» недоступно.
---
mode: required

method: netinstall-select

labels:
    step: "Режим системы"
    step[ru]: "Режим системы"

items:
    - id: aur
      name: "AUR — классический Arch-way"
      description: "Привычный сценарий CachyOS/Arch: pacman + AUR-хелпер (yay/paru по вкусу). Пакеты ставятся в систему императивно, обновления — как обычно. Рекомендуется, если вы не знаете, что выбрать."
      screenshot: "/etc/calamares/images/aur.png"

    - id: "Декларативный стек (Nix)"
      name: "Nix — декларативное окружение"
      description: "Поверх KvantOS ставятся nix и home-manager: пользовательское окружение (редакторы, тулчейн) описывается в flake.nix/home.nix и воспроизводимо на любой машине. Система остаётся Arch-based, это НЕ NixOS."
      screenshot: "/etc/calamares/images/nix.png"
