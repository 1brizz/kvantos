# SPDX-FileCopyrightText: no
# SPDX-License-Identifier: CC0-1.0
#
# KvantOS — модуль pacstrap: базовая система и файлы, копируемые в установленную систему.
# По образцу CachyOS, без cachyos-специфичных пакетов.
---

basePackages:
  - base
  - base-devel
  - btrfs-progs
  - cachyos-keyring
  - cachyos-mirrorlist
  - cryptsetup
  - device-mapper
  - diffutils
  - dosfstools
  - e2fsprogs
  - efibootmgr
  - exfatprogs
  - grub
  - grub-hook
  - f2fs-tools
  - inetutils
  - jfsutils
  - less
  - linux-cachyos
  - linux-cachyos-headers
  - linux-firmware
  - logrotate
  - lsb-release
  - lvm2
  - man-db
  - man-pages
  - mdadm
  - mkinitcpio
  - networkmanager
  - netctl
  - os-prober
  - perl
  - python
  - s-nail
  - sudo
  - sysfsutils
  - texinfo
  - usbutils
  - which
  - xfsprogs

# Файлы с live-системы, которые попадут в установленную систему
postInstallFiles:
  - "/etc/os-release"
  - "/etc/X11/xorg.conf.d/00-keyboard.conf"
