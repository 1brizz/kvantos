# SPDX-License-Identifier: CC0-1.0
#
# KvantOS — инициализация установленной системы до pacstrap:
# ключи (как у CachyOS: сначала cachyos-keyring), зеркала,
# resolv.conf и локальный репозиторий KvantOS (/opt/kvantos) —
# нужен ДО pacstrap, потому что /etc/pacman.conf целиком копируется
# в target и содержит секцию [kvantos] = file:///opt/kvantos/customrepo.
---

dontChroot: true

script:
 - command: "bash /etc/calamares/scripts/create-pacman-keyring"
   timeout: 1800
   verbose: true
 - "mkdir -p ${ROOT}/etc/pacman.d/"
 - "cp /etc/pacman.d/mirrorlist ${ROOT}/etc/pacman.d/"
 - "cp /etc/pacman.d/cachyos-mirrorlist ${ROOT}/etc/pacman.d/"
 - "cp -a /etc/pacman.d/gnupg ${ROOT}/etc/pacman.d/"
 - "cp /etc/resolv.conf ${ROOT}/etc/"
 - "mkdir -p ${ROOT}/opt"
 - "cp -a /opt/kvantos ${ROOT}/opt/"
 - "chmod 755 ${ROOT}/opt ${ROOT}/opt/kvantos ${ROOT}/opt/kvantos/customrepo"

i18n:
 name: "Инициализация pacman: ключи, зеркала, репозиторий KvantOS…"
 name[ru]: "Инициализация pacman: ключи, зеркала, репозиторий KvantOS…"
