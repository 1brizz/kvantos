# KvantOS — группы пакетов установщика (netinstall).
# Группы с именами, совпадающими с id из packagechooser_desktop.conf,
# включаются выбором окружения (method: netinstall-select).
---
- name: "KvantOS required (hidden)"
  description: "База KvantOS: ядро и репозиторий CachyOS"
  hidden: true
  selected: true
  critical: true
  packages:
     - cachyos-keyring
     - cachyos-mirrorlist
     - linux-cachyos
     - linux-cachyos-headers

- name: "Учебный стек KvantOS"
  description: "Toolchain для обучения программированию: компиляторы, python/jupyterlab, nodejs, rust, go, .NET, docker, БД, IDE. Можно снять галочку, если нужна чистая система."
  hidden: false
  selected: true
  critical: false
  packages:
     - gcc
     - clang
     - cmake
     - git
