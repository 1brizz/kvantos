#
# KvantOS — выбор окружения рабочего стола (packagechooser).
# method: netinstall-select — выбранный id включает одноимённую группу в netinstall.yaml.
---
mode: required

method: netinstall-select

labels:
    step: "Окружение рабочего стола"
    step[ru]: "Окружение рабочего стола"

default: Hyprland

items:
    - id: Hyprland
      name: "Hyprland + Noctalia (рекомендуемый)"
      description: "Фирменный вариант KvantOS: динамический тайлинговый композитор Hyprland с оболочкой Noctalia (Quickshell), терминалом Kitty и менеджером сессий uwsm. То же окружение, что используется разработчиком дистрибутива."
      screenshot: "/etc/calamares/images/hyprland.webp"

    - id: KDE-Desktop
      name: "KDE Plasma"
      description: "Полнофункциональная и гибко настраиваемая рабочая среда Plasma: Dolphin, Konsole, Kate и полный набор системных настроек. Хороший выбор для тех, кто предпочитает классический рабочий стол."
      screenshot: "/etc/calamares/images/kde.webp"

    - id: GNOME-Desktop
      name: "GNOME"
      description: "Современная минималистичная среда с собственным треком дизайна GNOME Shell, менеджером окон Mutter и экраном входа GDM."
      screenshot: "/etc/calamares/images/gnome.webp"

    - id: Xfce4
      name: "Xfce"
      description: "Лёгкая классическая среда с низким потреблением ресурсов: панель, файловый менеджер Thunar и терминал Xfce4 Terminal."
      screenshot: "/etc/calamares/images/xfce.jxl"

    - id: Cinnamon
      name: "Cinnamon"
      description: "Традиционный рабочий стол в духе GNOME 2 с современными возможностями, меню и панелями от проекта Linux Mint."
      screenshot: "/etc/calamares/images/cinnamon.jxl"

    - id: MATE-Desktop
      name: "MATE"
      description: "Продолжение GNOME 2: привычная классика с двумя панелями, Caja и комплектом приложений MATE."
      screenshot: "/etc/calamares/images/mate.jxl"

    - id: LXQT-Desktop
      name: "LXQt"
      description: "Очень лёгкая среда на Qt для слабого железа: PCManFM-Qt, QTerminal и минимум фоновых служб."
      screenshot: "/etc/calamares/images/lxqt.jxl"

    - id: Budgie-Desktop
      name: "Budgie"
      description: "Элегантная среда от проекта Solus на GTK с Raven-панелью и интеграцией с GNOME-стеком."
      screenshot: "/etc/calamares/images/budgie.jxl"

    - id: Cosmic
      name: "COSMIC"
      description: "Новое окружение System76 на Rust: модульные панели, встроенный тайлинг и экран входа cosmic-greeter."
      screenshot: "/etc/calamares/images/cosmic.webp"

    - id: Sway
      name: "Sway"
      description: "Тайлинговый композитор Wayland, совместимый с конфигурацией i3: Waybar, Wofi и терминал Foot."
      screenshot: "/etc/calamares/images/sway.jxl"

    - id: i3-Window-Manager
      name: "i3"
      description: "Классический тайлинговый оконный менеджер для X11: i3status, dmenu и Rofi, экран входа LightDM."
      screenshot: "/etc/calamares/images/i3.jxl"

    - id: Niri
      name: "Niri"
      description: "Прокручиваемый тайлинговый композитор Wayland с вертикальными столбцами окон: Waybar, Fuzzel и Foot."
      screenshot: "/etc/calamares/images/niri.webp"

    - id: Qtile
      name: "Qtile"
      description: "Оконный менеджер для X11, полностью настраиваемый на Python: конфигурация — обычный код."
      screenshot: "/etc/calamares/images/qtile.jxl"

    - id: bspwm
      name: "bspwm"
      description: "Тайлинговый менеджер окон, представляющий окна как листья двоичного дерева; управление через sxhkd и Rofi."
      screenshot: "/etc/calamares/images/bspwm.png"

    - id: Wayfire
      name: "Wayfire"
      description: "Композитор Wayland на wlroots с 3D-эффектами и модульной конфигурацией: Waybar и Wofi."
      screenshot: "/etc/calamares/images/wayfire.jxl"
