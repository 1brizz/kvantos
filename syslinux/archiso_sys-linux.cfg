LABEL kvantos
TEXT HELP
Boot the KvantOS live medium on BIOS.
It allows you to install KvantOS or perform system maintenance.
ENDTEXT
MENU LABEL KvantOS Live (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%

# Accessibility boot option
LABEL kvantosspeech
TEXT HELP
Boot the KvantOS live medium on BIOS with speakup screen reader.
It allows you to install KvantOS or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL KvantOS Live (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on %KERNEL_PARAMS%
